<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 180" width="1100" height="180" role="img" aria-labelledby="title desc">
<title id="title">Still making things — Mario / Eclipxse</title><desc id="desc">A small silver pixel moth gently flutters above a blue light.</desc>
<defs>
  <linearGradient id="body" x2="0.9" y2="1"><stop stop-color="#292f36"/><stop offset=".25" stop-color="#15191f"/><stop offset=".72" stop-color="#0c1015"/><stop offset="1" stop-color="#222831"/></linearGradient>
  <linearGradient id="edge" x2=".3" y2="1"><stop stop-color="#88939e"/><stop offset=".22" stop-color="#323c47"/><stop offset=".64" stop-color="#171e27"/><stop offset="1" stop-color="#586471"/></linearGradient>
  <linearGradient id="silver" x2=".5" y2="1"><stop stop-color="#fafaf4"/><stop offset=".36" stop-color="#d4d9d9"/><stop offset=".6" stop-color="#99a4ae"/><stop offset="1" stop-color="#e2e3de"/></linearGradient>
  <linearGradient id="glass" x2=".3" y2="1"><stop stop-color="#fff" stop-opacity=".06"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="blue"><stop stop-color="#5da9ff" stop-opacity=".4"/><stop offset=".3" stop-color="#3383e2" stop-opacity=".10"/><stop offset="1" stop-color="#3383e2" stop-opacity="0"/></radialGradient>
  <radialGradient id="corona"><stop offset=".64" stop-color="#d8e4ea" stop-opacity="0"/><stop offset=".72" stop-color="#d8e4ea" stop-opacity=".04"/><stop offset=".8" stop-color="#e6eff5" stop-opacity=".25"/><stop offset=".84" stop-color="#f3f7f7" stop-opacity=".64"/><stop offset=".89" stop-color="#dcecfb" stop-opacity=".08"/><stop offset="1" stop-color="#dcecfb" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#68798a" stroke-opacity=".055" fill="none"/></pattern>
  <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#070a0d"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".7"/></filter>
  <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="5"/></filter>
</defs><style>
.moth{animation:drift 9s cubic-bezier(.77,0,.175,1) infinite}.wing-left,.wing-right{animation:flap 1.5s ease-in-out infinite;transform-origin:0 0}
@keyframes drift{0%,100%{transform:translate(0,0)}30%{transform:translate(-12px,-7px)}65%{transform:translate(14px,-4px)}}
@keyframes flap{0%,100%{transform:scaleX(.85)}50%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce) { .motion, .motion * { animation: none !important; } .alternate { opacity: 0 !important; } }</style><rect width="1100" height="180" rx="8" fill="#090c10"/><path d="M42 33H1058" stroke="#27323e"/><ellipse cx="550" cy="92" rx="130" ry="78" fill="url(#blue)" opacity=".45"/><g transform="translate(550 84)"><g class="motion moth"><g class="motion wing-left"><path d="M-2-2h-4v-4h-5v-5h-7v4h-5v8h4v5h8v4h7v-4h2Z" fill="#c4d0da"/><path d="M-9-3h-5v5h5Z" fill="#506176"/></g><g class="motion wing-right"><path d="M2-2h4v-4h5v-5h7v4h5v8h-4v5h-8v4H4v-4H2Z" fill="#c4d0da"/><path d="M9-3h5v5H9Z" fill="#506176"/></g><path d="M-2-6h4v19h-4Z" fill="#eef0ed"/><path d="M-1-5v-4h-3v-3M1-5v-4h3v-3" stroke="#bcc9d5" fill="none"/></g></g><circle cx="550" cy="117" r="2.5" fill="#8dc7ff"/><text x="550" y="152" fill="#b2c0cc" font-family="monospace" font-size="11" letter-spacing="2.6" text-anchor="middle">STILL MAKING THINGS.</text><text x="42" y="153" fill="#677888" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="start">MARIO / ECLIPXSE</text><text x="1058" y="153" fill="#677888" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="end">END OF SIDE A</text></svg>